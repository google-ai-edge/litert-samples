<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 280px; margin: 0; padding: 14px; font: 13px/1.5 -apple-system, system-ui, sans-serif;
    background: #14141a; color: #e8e8ec; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  #status { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #7a7a85; flex: none; }
  .dot.ready { background: #3ecf6e; }
  .dot.busy { background: #f0b62f; }
  .dot.speaking { background: #4da3ff; }
  .dot.error { background: #ff5d5d; }
  #detail { color: #9a9aa5; min-height: 1.2em; margin-bottom: 10px; }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  button { flex: 1; font: inherit; border: 0; border-radius: 8px; padding: 7px 0; cursor: pointer;
    background: #33333d; color: #e8e8ec; }
  button:hover { background: #3d3d49; }
  .note { color: #9a9aa5; font-size: 11px; margin: 10px 0 0; }
</style>
</head>
<body>
<h1>Page Voice</h1>
<div id="status"><span class="dot" id="dot"></span><span id="label">…</span></div>
<div id="detail"></div>
<div class="row"><button id="read">Read selection</button><button id="stop">Stop</button></div>
<div class="row"><button id="test">Speak test</button><button id="load">Load model</button></div>
<p class="note">All inference runs locally — text never leaves your device.
Select text on any page → right-click → “Read aloud” (or Alt+R).</p>
<script src="popup.js"></script>
</body>
</html>
