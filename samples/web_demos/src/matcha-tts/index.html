<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Text → Speech — in your browser</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: rgba(18, 21, 26, 0.88);
    --text: #e8eaed;
    --muted: #9aa0a6;
    --accent: #7cc4ff;
    --border: rgba(255, 255, 255, 0.09);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }

  .panel {
    position: fixed;
    left: 16px;
    top: 16px;
    width: min(420px, calc(100vw - 32px));
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px 14px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }
  .back {
    display: inline-block; margin-bottom: 8px;
    font-size: 12.5px; color: var(--muted); text-decoration: none;
  }
  .back:hover { color: var(--accent); }
  h1 { font-size: 17px; font-weight: 650; letter-spacing: 0.1px; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }

  textarea {
    width: 100%;
    margin-top: 12px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border);
    border-radius: 9px;
    color: var(--text);
    font: inherit;
    font-size: 14px;
    padding: 9px 11px;
    resize: vertical;
    min-height: 74px;
  }
  textarea:focus { outline: none; border-color: var(--accent); }

  .buttons { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button {
    appearance: none;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    border-radius: 9px;
    padding: 8px 13px;
    font: inherit;
    font-size: 13.5px;
    cursor: pointer;
  }
  button:hover { background: rgba(255, 255, 255, 0.12); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: var(--accent); border-color: transparent; color: #06263f; font-weight: 600; }
  button.primary:hover { filter: brightness(1.06); }

  #status { margin-top: 11px; font-size: 12.5px; color: var(--muted); min-height: 18px; }
  #status .bar {
    display: inline-block; vertical-align: middle;
    width: 120px; height: 4px; margin-left: 8px;
    background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden;
  }
  #status .bar i { display: block; height: 100%; background: var(--accent); width: 0%; }

  #latency {
    margin-top: 8px; font-size: 12px; color: var(--text);
    display: none; line-height: 1.7;
  }
  #latency b { color: var(--accent); font-variant-numeric: tabular-nums; }
  #latency .env { color: var(--muted); font-size: 11px; }

  #ipa {
    margin-top: 6px; font-size: 11.5px; color: var(--muted); display: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  footer {
    position: fixed; left: 16px; right: 16px; bottom: 12px;
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    font-size: 12px; color: var(--muted);
    pointer-events: none;
  }
  footer span { background: rgba(11, 13, 16, 0.7); padding: 3px 8px; border-radius: 7px; }
  footer a { pointer-events: auto; color: var(--accent); }
</style>
</head>
<body>
  <div id="stage"><canvas id="viz"></canvas></div>

  <div class="panel">
    <a class="back" href="../">← All demos</a>
    <h1>Text → Speech, no cloud</h1>
    <div class="sub">Matcha-TTS + HiFi-GAN, running entirely in your browser on LiteRT.js (WebGPU + WASM). Nothing you type leaves this page.</div>
    <textarea id="text" spellcheck="false">This voice is being generated right now, inside your browser tab. No cloud, no server — your words never leave this page.</textarea>
    <div class="buttons">
      <button id="speak" class="primary" disabled>Speak</button>
      <button id="download" style="display:none">Download WAV</button>
    </div>
    <div id="status">Loading runtime…</div>
    <div id="latency"></div>
    <div id="ipa"></div>
  </div>

  <footer>
    <span>Your text never leaves this page.</span>
    <span>Model: <a href="https://huggingface.co/litert-community/Matcha-TTS" target="_blank" rel="noopener">Matcha-TTS</a> (MIT) · Runtime: <a href="https://www.npmjs.com/package/@litertjs/core" target="_blank" rel="noopener">LiteRT.js</a> · <a href="https://github.com/google-ai-edge/litert-samples/tree/main/samples/web_demos" target="_blank" rel="noopener">Source</a></span>
  </footer>

  <!-- Cross-origin isolation via the site-root service worker (see the
       comment in ../index.html). Without it the CFM decoder loses threaded
       WASM and is ~5-50x slower. -->
  <script>window.coi = { coepCredentialless: () => false };</script>
  <script src="../coi-serviceworker.min.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
