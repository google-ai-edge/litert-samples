<!-- Draws the model's answer with MathJax (fetched at build time, see app/build.gradle.kts). The page
     loads nothing from the network. -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; background: #ffffff; color: #1b1b1f; }
  #out { padding: 12px 16px; font: 17px/1.5 sans-serif; white-space: pre-wrap; overflow-x: auto; }
  mjx-container[display="true"] { margin: 0.4em 0 !important; }
  /* A display formula wider than the screen is scaled down to fit, so all of it can be checked at once. */
  mjx-container[display="true"] > svg { max-width: 100%; height: auto; }
</style>
<script>
  window.MathJax = {
    tex: { inlineMath: [['\\(', '\\)'], ['$', '$']], displayMath: [['\\[', '\\]'], ['$$', '$$']] },
    svg: { fontCache: 'global' },
    startup: { typeset: false }
  };
  // The answer goes in as text (no HTML), then MathJax typesets its formulas.
  function render(text) {
    const out = document.getElementById('out');
    MathJax.typesetClear([out]);
    out.textContent = text;
    return MathJax.typesetPromise([out]).then(function () {
      const errors = out.querySelectorAll('[data-mml-node="merror"]').length;
      Page.rendered(Math.ceil(document.body.scrollHeight), errors);
    });
  }
</script>
<script src="mathjax/tex-svg-full.js"></script>
</head>
<body><div id="out"></div></body>
</html>
