[package]
name = "text_classifier"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "GLiNER2 PII entity extraction / text classification sample using LiteRT Rust bindings"

[dependencies]
google-ai-edge-litert = { version = "0.2" }
clap = { version = "4.5", features = ["derive"] }
tokenizers = "0.23"

[dev-dependencies]
googletest = "0.14"

[[bin]]
name = "text_classifier"
path = "main.rs"
