name: TextToSpeech
options:
  bundleIdPrefix: com.google.ai.edge
  deploymentTarget:
    iOS: "17.0"
packages:
  LiteRT:
    path: ${LITERT_CHECKOUT}
targets:
  TextToSpeech:
    type: application
    platform: iOS
    sources:
      - path: Sources/MatchaCore
      - path: Sources/MatchaRuntime
      - path: Sources/App
      # A top-level Resources folder inside an iOS app bundle breaks bundle identification.
      - path: Models
        type: folder
        buildPhase: resources
    dependencies:
      - package: LiteRT
        product: LiteRT
      - package: LiteRT
        product: LiteRtMetalAccelerator
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Text to Speech
        MatchaBuildConfiguration: $(CONFIGURATION)
        MatchaLiteRTCommit: ${LITERT_COMMIT}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.google.ai.edge.TextToSpeech
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # The pinned upstream runtime provides only arm64 simulator slices.
        "ARCHS[sdk=iphonesimulator*]": arm64
        CODE_SIGN_STYLE: Automatic
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
schemes:
  TextToSpeech:
    build:
      targets:
        TextToSpeech: all
