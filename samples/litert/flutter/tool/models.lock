# The models built into the app, fetched into assets/models/ by tool/fetch_models.sh.
# They are not in git; their notice, assets/models/NOTICE.md, is.
#
# One file per line, fields separated by spaces:
#   hf  <dest> <size> <sha256> <access> <repo> <revision> <path>
#       https://huggingface.co/<repo>/resolve/<revision>/<path>, saved as assets/models/<dest>.
#   yolo26n-rawhead  <dest> <size> <sha256> <access> <repo> <revision> <path> <source size> <source sha256>
#       <path> is Arm's original; tool/prune_yolo26n_head.py derives <dest> from it in a venv with the
#       packages of the `pip` line. The derived file must come out byte for byte (<sha256>).
#   pip <requirement>...
# <size> and <sha256> are the file in assets/models/. They match NOTICE.md and
# lib/data/services/model_store/bundled_model_files.dart (test/tool/models_lock_test.dart checks both).
# <access> is public or gated. A gated repo needs HF_TOKEN from an account that accepted its terms.
# <revision> is a full commit. How each pin was checked:
#   - LFS files: the HF API's lfs.oid (= SHA-256) and size at that revision.
#   - Plain git files (both tokenizers, config.json, g2p_meta.json): the blob id equals `git hash-object`.
#   - EmbeddingGemma: the repo is gated, so the API needs a token; huggingface_hub's download metadata
#     for these files (.cache/huggingface/download/*.metadata) gives this commit and the SHA-256 etag.
#   - YOLO26n: Arm's file is unchanged since its upload commit (lastCommit). ai-edge-litert 2.2.0 and
#     2.1.5 (with flatbuffers 25.12.19) both reproduce 5ddd5eeb… byte for byte.
#     Fallback if a machine cannot derive it (no wheel, e.g. an Intel Mac, or a future drift): host the
#     derived file in a Hugging Face repo and replace that line with an `hf` line. No Python is needed
#     then.

pip ai-edge-litert==2.2.0 flatbuffers==25.12.19

