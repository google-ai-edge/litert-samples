include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - build/**
    - android/**
    - ios/**
    - macos/**
    - linux/**
    # flutter_litert + our patch, generated by tool/flutter_litert/vendor.sh
    - third_party/**

linter:
  rules:
    # Camera/audio/token streams and model sessions are long-lived: make every
    # fire-and-forget future and every open stream/sink an explicit decision.
    - unawaited_futures
    - discarded_futures
    - cancel_subscriptions
    - close_sinks
    # Regression guards: (almost) no hits when enabled.
    - avoid_dynamic_calls
    - strict_top_level_inference
    - use_super_parameters
    - avoid_void_async
    - avoid_futureor_void
    - throw_in_finally
    - test_types_in_equals
    - prefer_void_to_null
    - no_literal_bool_comparisons
    - unnecessary_breaks
    - parameter_assignments
    - sort_constructors_first
    # Mechanical style, applied by dart fix.
    - prefer_const_constructors
    - directives_ordering
    - prefer_final_locals
    - avoid_multiple_declarations_per_line
    # A value equal to the default is dropped, unless it is a --dart-define,
    # a config knob or a pinned plugin setting (then an ignore says so).
    - avoid_positional_boolean_parameters
    # Throw and catch Exceptions and Errors deliberately.
    - avoid_catching_errors
    - only_throw_errors
    - unsafe_variance
    # Every ignore says why, and none outlives its diagnostic.
    - document_ignores
    - unnecessary_ignore
    # Not enabled:
    # - unnecessary_await_in_return: deprecated in Dart 3.13 (deprecated_lint).
    # - avoid_redundant_argument_values: most hits are dart-define constants
    #   or settings pinned against a plugin default on purpose; the ignores
    #   cost more than the rule finds.
    # - avoid_slow_async_io: sync I/O on the UI isolate is a risk on Android
    #   storage.
    # - cascade_invocations: readability.
    # - avoid_catches_without_on_clauses: the catch-all boundaries are
    #   deliberate and documented.
    # - public_member_api_docs.
    # - comment_references: false positives with private named parameters.
