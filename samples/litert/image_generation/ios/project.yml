# Bonsai — minimal on-device text-to-image app (xcodegen).
# Before generating: ./prep_resources.sh (tokenizer tables + pipeline_meta.json
# into Resources/) and ./prep_clitert.sh (the official CLiteRT.xcframework,
# bazel-built from the LiteRT repo — no LiteRT code is committed here).
name: BonsaiApp
options:
  bundleIdPrefix: com.google.ai.edge
  deploymentTarget:
    iOS: "17.0"
targets:
  BonsaiApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../shared
        group: Shared
      - path: Resources
        buildPhase: resources
    dependencies:
      - framework: CLiteRT.xcframework
        embed: true
        codeSign: true
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Bonsai
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.google.ai.edge.Bonsai
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Bridging.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../shared
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
