name: intel_npu_demo
description: "Gemma on the CPU, GPU and NPU from Flutter desktop: a backend benchmark, long context, and a 3D scene narrated live by the model."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  # flutter_scene needs 3.47.0; Windows needs 3.47.1 for
  # DartProject::set_enable_flutter_gpu (windows/runner/main.cpp).
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_gemma: ^1.8.3
  # Exact: lib/core/engines/engine_slot.dart imports its src/ FFI client.
  flutter_gemma_litertlm: 1.7.0
  scrollable_positioned_list: ^0.3.8
  cupertino_icons: ^1.0.8
  flutter_scene: ^0.23.0
  vector_math: ^2.4.2
  hooks: ^2.2.0
  flutter_scene_rapier: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # flutter_gemma_litertlm stages its macOS companion dylibs through a
  # CocoaPods post_install phase (see macos/Podfile), so keep the CocoaPods path.
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - assets/prompts/
    - assets/models/
    - flutter_scene_generated/
