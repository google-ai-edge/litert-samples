name: intel_npu_demo
description: "Gemma on the CPU, GPU and NPU from Flutter desktop: a backend benchmark, long context, and a 3D scene narrated live by the model."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  # flutter_scene needs 3.47.0; Windows needs 3.47.1 for
  # DartProject::set_enable_flutter_gpu (windows/runner/main.cpp).
  flutter: ">=3.47.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_edge_ai: ^2.5.4
  # 1.17.0: OpenVINO 2026.4.1 on Windows, which Gemma 4 12B on the Panther
  # Lake NPU needs. 1.18.0: LiteRtLmEngine(thinkingTokenBudget:), without
  # which the Intel 26B on the NPU thinks until the output cap (Act 4).
  # 1.19.0: Gemma 4 12B on an Intel GPU answers prompts under 512 tokens;
  # needs macOS 14.
  flutter_edge_ai_litertlm: ^1.19.0
  scrollable_positioned_list: ^0.3.8
  # Act 4: open a meeting transcript (the system file dialog).
  file_selector: ^1.0.3
  cupertino_icons: ^1.0.8
  flutter_scene: ^0.23.0
  vector_math: ^2.4.2
  hooks: ^2.2.0
  flutter_scene_rapier: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # flutter_edge_ai_litertlm stages its macOS companion dylibs through a
  # CocoaPods post_install phase (see macos/Podfile), so keep the CocoaPods path.
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - assets/prompts/
    - assets/agent/example/
    - assets/models/
    - flutter_scene_generated/
