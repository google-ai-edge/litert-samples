syntax = "proto3";

package litert.lm.proto;

option java_multiple_files = true;

// Architecture-specific parameters for deepseek-ai/Janus-Pro-1B and
// Janus-Pro-7B: unified multimodal understanding and autoregressive visual
// generation (SigLIP-L-16-384 + Aligner vision encoder, VQ-16 + GenAligner
// image embedder, DeepSeek-LLM backbone, GenHead VQ token predictor with
// classifier-free guidance, and VQ-16 image decoder).
message JanusPro {
  // LLM backbone hidden dimension (default 2048 for 1B, 4096 for 7B).
  optional int32 llm_hidden_size = 1;
  // LLM backbone text vocabulary size (default 102400).
  optional int32 llm_vocab_size = 2;
  // VQ-16 visual codebook size (default 16384).
  optional int32 vq_codebook_size = 3;
  // VQ-16 codebook vector dimension (default 8).
  optional int32 vq_codebook_embed_dim = 4;
  // Input/output image resolution in pixels (default 384).
  optional int32 image_size = 5;
  // Vision/VQ patch size in pixels (default 16).
  optional int32 patch_size = 6;
  // Number of visual tokens per image (default 576 = 24 * 24).
  optional int32 num_image_tokens = 7;
  // Default classifier-free guidance weight for visual generation
  // (default 5.0).
  optional float cfg_weight = 8;
  // Default sampling temperature for visual generation (default 1.0).
  optional float image_temperature = 9;
  // Whether to run in visual generation mode by default (default false).
  optional bool generate_image = 10;
  // Maximum number of LLM text tokens to generate per turn (default 512).
  optional int32 max_new_tokens = 11;
}
